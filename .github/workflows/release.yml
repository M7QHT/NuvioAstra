# Every push to `main` builds Nuvio Astra for Windows x64 and publishes a GitHub Release:
#   Nuvio-Astra-<v>-x64-setup.exe        installer (also the update package of the in-app updater)
#   Nuvio-Astra-<v>-x64-setup.exe.sig    updater signature (minisign, bound to <v>)
#   Nuvio-Astra-<v>-x64-portable.zip     portable folder
#   latest.json                          updater manifest (read by installed apps)
#   SHA256SUMS.txt                       checksums
# Version: <major>.<minor> from apps/nuvio-desktop/tauri.conf.json, patch = run number (+ optional
# repository variable VERSION_PATCH_OFFSET), so every build gets a new, higher version.
# Nothing is published unless every step (tests, build, packaging, signing) succeeded: the release is
# created as a draft with all its files and only then made public.
name: Release (Windows x64)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.12.6

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:KEY) { throw "Secret TAURI_SIGNING_PRIVATE_KEY is missing (see GITHUB_PUBLISH.md)" }
          if (-not $env:PW) { throw "Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing (see GITHUB_PUBLISH.md)" }

      - name: Version
        id: version
        env:
          OFFSET: ${{ vars.VERSION_PATCH_OFFSET }}
        run: |
          $conf = Get-Content apps/nuvio-desktop/tauri.conf.json -Raw | ConvertFrom-Json
          $parts = $conf.version.Split('.')
          $offset = if ($env:OFFSET) { [int]$env:OFFSET } else { 0 }
          $patch = [int]$env:GITHUB_RUN_NUMBER + $offset
          $version = "$($parts[0]).$($parts[1]).$patch"
          git fetch --tags --force
          if (git tag --list "v$version") { throw "Tag v$version already exists (raise VERSION_PATCH_OFFSET)" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Apply version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $p = "apps/nuvio-desktop/tauri.conf.json"
          $c = Get-Content $p -Raw
          $c = $c -replace '"version":\s*"[^"]+"', ('"version": "' + $env:VERSION + '"')
          [IO.File]::WriteAllText((Resolve-Path $p), $c)
          $t = Get-Content Cargo.toml -Raw
          $t = $t -replace '(?m)^version = "[^"]+"', ('version = "' + $env:VERSION + '"')
          [IO.File]::WriteAllText((Resolve-Path Cargo.toml), $t)
          Select-String -Path $p, Cargo.toml -Pattern $env:VERSION

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/nuvio-desktop/web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Native libraries (pinned SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deps = Get-Content packaging/windows/deps.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force deps | Out-Null
          # Nuvio Engine: official release of NuvioMedia/nuvio-engine.
          $zip = "deps/nuvio-engine.zip"
          Invoke-WebRequest $deps.nuvioEngine.url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $deps.nuvioEngine.zipSha256) { throw "nuvio-engine zip checksum mismatch" }
          Expand-Archive $zip -DestinationPath deps/nuvio-engine -Force
          Copy-Item (Join-Path deps/nuvio-engine $deps.nuvioEngine.dllPath) deps/nuvio_engine.dll
          if ((Get-FileHash deps/nuvio_engine.dll -Algorithm SHA256).Hash -ne $deps.nuvioEngine.dllSha256) { throw "nuvio_engine.dll checksum mismatch" }
          # libmpv: uploaded once to this repository's release "deps-libmpv" (see GITHUB_PUBLISH.md).
          gh release download $deps.libmpv.releaseTag --repo $env:GITHUB_REPOSITORY --pattern $deps.libmpv.asset --dir deps --clobber
          if ($LASTEXITCODE) { throw "libmpv-2.dll not found in release '$($deps.libmpv.releaseTag)' (see GITHUB_PUBLISH.md)" }
          if ((Get-FileHash deps/libmpv-2.dll -Algorithm SHA256).Hash -ne $deps.libmpv.sha256) { throw "libmpv-2.dll checksum mismatch" }

      - name: Frontend
        working-directory: apps/nuvio-desktop/web
        run: |
          npm ci
          npm run build

      - name: Tests
        run: cargo test --workspace

      - name: Build (release)
        env:
          NUVIO_UPDATE_REPOSITORY: ${{ github.repository }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ vars.NUVIO_SUPABASE_FALLBACK_URL }}
        run: cargo build --release -p nuvio-desktop

      - name: NSIS
        run: |
          $nsis = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS") | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          if (-not $nsis) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS" }
          "NSIS_HOME=$nsis" >> $env:GITHUB_ENV

      - name: Package (portable folder + installer)
        run: ./packaging/windows/build-release.ps1 -SkipBuild -LibMpv deps/libmpv-2.dll -Engine deps/nuvio_engine.dll

      - name: Sign the update package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setup = "dist/Nuvio-Astra-$env:VERSION-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer not found: $setup" }
          npx --yes "@tauri-apps/cli@$env:TAURI_CLI_VERSION" signer sign --app-version $env:VERSION $setup
          if ($LASTEXITCODE -or -not (Test-Path "$setup.sig")) { throw "signing failed" }

      - name: Release files, notes, latest.json, checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          $out = New-Item -ItemType Directory -Force release
          $setup = "Nuvio-Astra-$v-x64-setup.exe"
          Copy-Item "dist/$setup", "dist/$setup.sig" $out
          Compress-Archive -Path "dist/Nuvio Astra/*" -DestinationPath "$out/Nuvio-Astra-$v-x64-portable.zip"

          # Notes: commit subjects since the previous release tag (read as UTF-8: accents kept).
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $prev = git describe --tags --abbrev=0 --match "v*" 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $lines = git -c i18n.logOutputEncoding=UTF-8 log $range --no-merges --pretty=format:"- %s" | Select-Object -First 40
          if (-not $lines) { $lines = @("- Melhorias e correções.") }
          $notes = ($lines -join "`n")
          $body = "## Nuvio Astra $v`n`n$notes`n`n---`nWindows 10/11 x64. Quem já tem o Nuvio Astra recebe esta versão pelo próprio aplicativo. Perfis, addons, configurações e a sessão da conta são mantidos.`n"
          [IO.File]::WriteAllText("$PWD/release-notes.md", $body)

          $manifest = [ordered]@{
            version   = $v
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$out/$setup.sig" -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/$setup"
              }
            }
          }
          [IO.File]::WriteAllText("$out/latest.json", ($manifest | ConvertTo-Json -Depth 5))

          $sums = Get-ChildItem $out -File | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$out/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-ChildItem $out | Format-Table Name, Length

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          # Draft first with every file; it becomes public (and "latest") only when all uploads worked.
          gh release create $tag (Get-ChildItem release -File).FullName --draft --target $env:GITHUB_SHA --title "Nuvio Astra $env:VERSION" --notes-file release-notes.md
          if ($LASTEXITCODE) { throw "release creation failed" }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE) { throw "release publication failed" }
