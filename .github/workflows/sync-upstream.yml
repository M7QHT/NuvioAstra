name: Sync Upstream (ScottGzin/NuvioAstra)

on:
  schedule:
    # Check upstream every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and merge upstream
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/ScottGzin/NuvioAstra.git
          git fetch upstream main

          NEW_COMMITS=$(git rev-list --count HEAD..upstream/main)
          echo "New upstream commits: $NEW_COMMITS"
          if [ "$NEW_COMMITS" -eq 0 ]; then
            echo "Already up to date with upstream."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Attempt merge
          if git merge upstream/main --no-edit; then
            echo "Clean merge succeeded."
          else
            # Keep our fork-specific README and disabled release workflow if only those conflicted
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "Conflicting files:"
            echo "$CONFLICTS"

            for f in README.md .github/workflows/release.yml; do
              if echo "$CONFLICTS" | grep -qx "$f"; then
                git checkout --ours "$f"
                git add "$f"
              fi
            done

            REMAINING=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAINING" ]; then
              echo "Unresolved code conflicts remain:"
              echo "$REMAINING"
              git merge --abort

              # Open a single notification issue if one is not already open
              EXISTING=$(gh issue list --state open --search "Upstream sync conflict" --json number --jq 'length')
              if [ "$EXISTING" -eq 0 ]; then
                gh issue create \
                  --title "Upstream sync conflict detected" \
                  --body "New commits are available on \`ScottGzin/NuvioAstra\` ($NEW_COMMITS commit(s)), but automatic merge had conflicts in:\n\n\`\`\`\n$REMAINING\n\`\`\`\n\nPlease resolve manually to preserve fork customizations."
              fi
              echo "updated=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit --no-edit
          fi

          git push origin main
          echo "updated=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    uses: ./.github/workflows/build-english.yml
